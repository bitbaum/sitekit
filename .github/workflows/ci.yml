# GOLDEN CI FLOOR — pnpm. From dotfiles/templates/ci/.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes the older run obsolete — don't waste minutes finishing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json (SSOT);
      # pnpm/action-setup@v6 errors if both are specified.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SSOT: "verified" is defined ONCE, in package.json `verify`
      # (= lint + typecheck + build + test), and run identically here and
      # locally via `pnpm run verify`. Change the checks in one place, not two.
      - name: Verify
        run: pnpm run verify
